<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تذكير العلاج</title>
<meta name="description" content="تطبيق لتذكير المريض بالجرعات الدوائية ومواعيد المتابعة، مع متابعة الالتزام بالعلاج.">
<meta name="theme-color" content="#0fb295">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="تذكير العلاج">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icons/favicon-64.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <img src="./icons/favicon-64.png" alt="" class="brand-logo" width="36" height="36">
      <div class="brand-text">
        <h1 id="app-title">تذكير العلاج</h1>
        <p id="app-tagline" class="muted"></p>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-lang" type="button" title="Language">
        <span id="lang-label">EN</span>
      </button>
      <button class="icon-btn primary-ghost" id="btn-install" type="button" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="view" role="main"></main>

  <nav class="tabbar" id="tabbar" aria-label="التنقل"></nav>
</div>

<dialog id="modal" class="modal"></dialog>
<div id="toast-wrap" class="toast-wrap" aria-live="polite"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
