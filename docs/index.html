<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تذكير العلاج</title>
    <!-- ربط الملفات الـ 3 اللي بعتهولك -->
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="app">
        <!-- الهيدر (رأس الصفحة) -->
        <header class="topbar">
            <div class="brand">
                <h1 id="app-title">تذكير العلاج</h1>
                <p id="app-tagline" class="muted">خُذ دواك في وقته.. صحتك أمانة.</p>
            </div>
            <div class="topbar-actions">
                <button class="icon-btn" id="btn-lang" onclick="changeLang(state.lang === 'ar' ? 'en' : 'ar')">
                    <span id="lang-label">EN</span>
                </button>
            </div>
        </header>

        <!-- المحتوى الرئيسي (اللي بيتغير بـ app.js) -->
        <main id="view" class="view" role="main">
            <!-- هنا بيظهر الجدول والأدوية -->
        </main>

        <!-- شريط التنقل السفلي -->
        <nav class="tabbar" id="tabbar">
            <!-- بيتحمل بالجافاسكريبت -->
        </nav>
    </div>

    <!-- نافذة إضافة دواء جديدة -->
    <dialog id="modal" class="modal"></dialog>

    <!-- إشعارات صغيرة (Toast) -->
    <div id="toast-wrap" class="toast-wrap" aria-live="polite"></div>

    <!-- استدعاء ملفات الجافاسكريبت بالترتيب الصحيح -->
    <script type="module" src="./sounds.js"></script>
    <script type="module" src="./native.js"></script>
    <script type="module" src="./i18n.js"></script>
    <script type="module" src="./app.js"></script>
</body>
</html>
